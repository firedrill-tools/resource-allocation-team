[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resource-allocation-team"
version = "0.1.0"
description = "Google ADK specialist workflow over transactional synthetic resources"
requires-python = ">=3.12"
dependencies = ["google-adk==2.12.0"]

[project.scripts]
resource-team = "resource_team.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/resource_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]
